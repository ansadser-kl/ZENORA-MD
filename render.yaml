services:
  - type: web
    name: hermit-md
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: RENDER_NAME
        sync: false
        required: true
      - key: RENDER_API
        sync: false
        required: true
      - key: SESSION_ID
        value: mybot
      - key: PAIR_NUMBER
        sync: false
      - key: REPO_URL
        sync: false
      - key: DATABASE_URL
        sync: false
        required: true
      - key: PREFIX
        sync: false
      - key: SUDO
        sync: false
      - key: MODE
        value: "private"
      - key: LOG_MSG
        value: "false"
      - key: AUTO_STATUS_VIEW
        value: "false"
      - key: READ_MSG
        value: "false"
      - key: ALWAYS_ONLINE
        value: "false"
      - key: START_MSG
        value: "true"
      - key: PORT
        value: "3000"
